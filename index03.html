<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDGs 性別平權</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        * {
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            overflow: hidden;
            background: #eecda3;
            background: linear-gradient(to right, #ef629f, #eecda3);
        }

        /* Village Map Field Background */
        .map-bg {
            background-color: #7ec850;
            background-image: 
                radial-gradient(#95d668 15%, transparent 16%),
                radial-gradient(#95d668 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
        }

        /* Village Paths (SVG Overlay simulated path) */
        .path-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Floating Hut & Interactive Animation */
        .hut-card {
            position: absolute;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25));
        }

        .hut-card:hover {
            transform: scale(1.15) translateY(-8px);
            z-index: 40 !important;
            filter: drop-shadow(0 12px 20px rgba(255, 255, 255, 0.6)) brightness(1.1);
        }

        .hut-card:active {
            transform: scale(0.95);
        }

        /* Float Animation for unvisited huts */
        @keyframes floatIdle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .idle-float {
            animation: floatIdle 3s infinite ease-in-out;
        }

        /* Top Bar Styling */
        .top-bar-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 3px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* Glass Modal Backdrop */
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="w-screen h-screen relative map-bg overflow-hidden">

    <!-- Top Header Navigation (Left: Title, Right: Score) -->
    <header class="absolute top-0 left-0 right-0 z-30 p-4 md:p-6 flex justify-between items-center pointer-events-none">
        
        <!-- Left: Game Title (大粗體) -->
        <div class="pointer-events-auto top-bar-card px-6 py-3 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-tr from-pink-500 to-rose-400 rounded-xl flex items-center justify-center text-white text-xl shadow-md">
                <i class="fas fa-venus-mars"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-rose-600 tracking-wider">
                    SDGs 性別平權
                </h1>
                <p class="text-xs font-bold text-gray-500">關卡一：平權村莊小解謎 🏡</p>
            </div>
        </div>

        <!-- Right: Correct Score Tracker -->
        <div class="pointer-events-auto top-bar-card px-6 py-3 rounded-2xl flex items-center gap-4">
            <div class="text-right">
                <span class="block text-xs font-bold text-gray-400">當前進度與答對</span>
                <span id="score-display" class="text-xl md:text-2xl font-black text-emerald-600">
                    答對題數：0 / 10
                </span>
            </div>
            <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center text-emerald-600 font-black">
                <i class="fas fa-check-double text-lg"></i>
            </div>
        </div>
    </header>

    <!-- Winding Dirt Paths in Village (SVG Path) -->
    <svg class="path-svg">
        <path d="M 150 180 Q 250 220 400 160 T 700 240 T 950 180 T 1150 300 T 800 500 T 500 450 T 200 580 T 600 680 T 1000 650" 
              fill="none" stroke="#e0c088" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        <path d="M 150 180 Q 250 220 400 160 T 700 240 T 950 180 T 1150 300 T 800 500 T 500 450 T 200 580 T 600 680 T 1000 650" 
              fill="none" stroke="#cf9e57" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    </svg>

    <!-- Decorative Trees & Flowers -->
    <div class="absolute top-28 left-12 opacity-80 pointer-events-none text-4xl">🌳</div>
    <div class="absolute top-44 left-1/3 opacity-80 pointer-events-none text-3xl">🌸</div>
    <div class="absolute top-1/2 left-8 opacity-80 pointer-events-none text-4xl">🌲</div>
    <div class="absolute bottom-20 left-1/4 opacity-80 pointer-events-none text-3xl">🌻</div>
    <div class="absolute top-36 right-16 opacity-80 pointer-events-none text-4xl">🌳</div>
    <div class="absolute top-2/3 right-12 opacity-80 pointer-events-none text-4xl">🌲</div>

    <!-- Main Village Map Layer with 10 Straw Huts -->
    <main id="village-map" class="w-full h-full relative">
        <!-- 10 Huts will be dynamically placed via JavaScript -->
    </main>

    <!-- Quiz Question Modal -->
    <div id="quiz-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-xl w-11/12 shadow-2xl border-4 border-rose-300 transform scale-95 transition-transform duration-300 relative" id="quiz-card">
            
            <!-- Header Tag -->
            <div class="flex justify-between items-center mb-4">
                <span id="question-tag" class="bg-rose-100 text-rose-700 font-black px-4 py-1.5 rounded-full text-sm">
                    茅草屋 #1
                </span>
                <span class="text-xs font-bold text-gray-400">SDGs 5 性別平等議題</span>
            </div>

            <!-- Question Text -->
            <h3 id="question-text" class="text-lg md:text-xl font-black text-gray-800 mb-6 leading-relaxed">
                題目載入中...
            </h3>

            <!-- Options Container -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- Option buttons injected here -->
            </div>

            <!-- Instant Feedback Message -->
            <div id="feedback-box" class="hidden p-4 rounded-2xl mb-4 text-sm font-bold border leading-relaxed">
            </div>

            <!-- Next / Close Modal Button -->
            <div class="flex justify-end">
                <button id="modal-next-btn" onclick="closeQuizModal()" class="hidden bg-rose-500 hover:bg-rose-600 text-white font-black px-6 py-2.5 rounded-xl shadow-lg transition active:scale-95">
                    關閉並繼續探索 🏡
                </button>
            </div>
        </div>
    </div>

    <!-- Settlement Modal (Game Over / Level Clear) -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-8 max-w-md w-11/12 text-center shadow-2xl border-4 border-rose-400 transform scale-90 transition-transform duration-300">
            
            <div id="result-icon" class="w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl shadow-inner">
                🏆
            </div>

            <h2 id="result-title" class="text-3xl font-black text-gray-800 mb-2">
                結算中...
            </h2>

            <p id="result-desc" class="text-gray-600 font-bold mb-6 leading-relaxed">
                描述載入中...
            </p>

            <!-- Action Button Dynamic -->
            <div id="result-action-container">
                <!-- Challenge Again or Next Level Button -->
            </div>
        </div>
    </div>

    <!-- Game Logic Script -->
    <script>
        // Web Audio API Sound Generator
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); // E5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                }
            } catch(e) {}
        }

        // 10 SDGs Gender Equality Questions
        const QUESTIONS = [
            {
                id: 1,
                title: "什麼是『同工同酬』原則？",
                options: [
                    "男性的工作量必須比女性多才能多拿薪水",
                    "付出相同的努力與職務，不論性別應享有同等報酬",
                    "女性薪水應一律高於男性以作為補償",
                    "只有主管級職務才需要落實同工同酬"
                ],
                answer: 1,
                explain: "正確！『同工同酬』是消除職場性別薪資差距的核心，相同工作職責不應因性別有薪資差異。"
            },
            {
                id: 2,
                title: "根據聯合國 SDGs 5 倡議，下列何者屬於打破『性別刻板印象』的行為？",
                options: [
                    "認為男生不能哭泣、女生不能學寫程式",
                    "鼓勵男生擔任護理師，支持女生擔任機械工程師",
                    "認定家務勞動全都是女性的固有責任",
                    "限制女性參與公共政治與決策討論"
                ],
                answer: 1,
                explain: "正確！職業與興趣不應受性別框架限制，每個人都有發揮潛能的平等權利。"
            },
            {
                id: 3,
                title: "關於無償家務勞動（如洗碗、照顧幼童），何者才是性別平等的體現？",
                options: [
                    "家務全部由母親獨自承擔",
                    "家庭成員共同分擔家務與照顧責任",
                    "父親只需負責外出賺錢，完全不需做家務",
                    "家務只是女性的專屬天職"
                ],
                answer: 1,
                explain: "正確！共同分擔無償家務與照顧責任，能促進家庭內部真正的性別平等。"
            },
            {
                id: 4,
                title: "促進女性參與政治與公共事務決策，對社會有何正面幫助？",
                options: [
                    "只對女性有利，對男性沒有影響",
                    "能帶來更多元的觀點，讓政策更具包容性與周延",
                    "會降低行政決策的效率",
                    "沒有任何顯著作用"
                ],
                answer: 1,
                explain: "正確！女性參與決策能帶入多元經驗，打造更全方位、平等的社會體制。"
            },
            {
                id: 5,
                title: "當遇到性別歧視或性騷擾事件時，正確的態度應該是什麼？",
                options: [
                    "勇敢發聲尋求協助，並支持被害者保護權益",
                    "忍氣吞聲，當作沒發生過",
                    "指責被害者穿著或言行不當",
                    "檢討受害者為什麼不早點離開"
                ],
                answer: 0,
                explain: "正確！反對性別暴力與騷擾，建立友善通報與支持系統是消除歧視的關鍵。"
            },
            {
                id: 6,
                title: "下列何者符合 STEM（科學、技術、工程、數學）領域的性別平等發展？",
                options: [
                    "認為女生邏輯不好，不適合學理工科系",
                    "提供優質教育資源，鼓勵所有性別平等探索科技領域",
                    "限制男性報名文科相關科系",
                    "只允許男性報名程式設計比賽"
                ],
                answer: 1,
                explain: "正確！鼓勵所有性別參與科技與科學領域，有助於消弭產業中的性別偏見。"
            },
            {
                id: 7,
                title: "『育嬰留職停薪假』（育嬰假）的權利應該屬於誰？",
                options: [
                    "僅限於母親申請",
                    "雙親（父親與母親）皆有權申請共同陪伴孩子成長",
                    "僅限於高薪高主管職務者",
                    "父親申請會被視為不敬業"
                ],
                answer: 1,
                explain: "正確！雙親均享有育嬰假，能讓父親更深入參與育兒，促進親職平權。"
            },
            {
                id: 8,
                title: "消除對女性一切形式的歧視公約（CEDAW）又被稱為？",
                options: [
                    "女性人權宣言",
                    "世界性別經濟法典",
                    "兒童權利公約",
                    "永續環境保護條約"
                ],
                answer: 0,
                explain: "正確！CEDAW 是保障女性權益、推動性別平等極重要的國際人權公約。"
            },
            {
                id: 9,
                title: "在學校或職場中，如果以『性別氣質』（如男生較細心、女生較豪爽）嘲笑他人，屬於什麼行為？",
                options: [
                    "正常的幽默開玩笑",
                    "性別霸凌與歧視，應及時制止與改正",
                    "值得鼓勵的社交互動",
                    "個人自由不需被約束"
                ],
                answer: 1,
                explain: "正確！尊重每個人的性別特質與氣質，不加予嘲諷與標籤化，是平權的基石。"
            },
            {
                id: 10,
                title: "實現 SDGs 5 性別平權目標，誰扮演著關鍵角色？",
                options: [
                    "只有政府官員需要負責任",
                    "只有女性需要努力倡議",
                    "社會上的每一個人（包含所有性別、學校與企業）",
                    "僅靠國際組織宣導即可"
                ],
                answer: 2,
                explain: "正確！性別平權需要全體社會共同努力與實踐，打造尊重與包容的环境。"
            }
        ];

        // 10 Hut Coordinate Locations on Map (% units)
        const HUT_POSITIONS = [
            { x: 12, y: 22 }, // 1
            { x: 32, y: 16 }, // 2
            { x: 55, y: 24 }, // 3
            { x: 78, y: 18 }, // 4
            { x: 90, y: 36 }, // 5
            { x: 65, y: 52 }, // 6
            { x: 40, y: 48 }, // 7
            { x: 15, y: 62 }, // 8
            { x: 48, y: 76 }, // 9
            { x: 78, y: 70 }  // 10
        ];

        // Game Dynamic States
        let answeredCount = 0;
        let correctCount = 0;
        let currentHutIndex = null;
        let hutStates = new Array(10).fill(false); // Visited or not

        const villageMap = document.getElementById('village-map');
        const scoreDisplay = document.getElementById('score-display');
        const quizModal = document.getElementById('quiz-modal');
        const quizCard = document.getElementById('quiz-card');
        const questionTag = document.getElementById('question-tag');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackBox = document.getElementById('feedback-box');
        const modalNextBtn = document.getElementById('modal-next-btn');
        const resultModal = document.getElementById('result-modal');

        // Initialize Village Map & Render 10 Straw Huts
        window.onload = () => {
            renderHuts();
        };

        function renderHuts() {
            villageMap.innerHTML = '';
            HUT_POSITIONS.forEach((pos, idx) => {
                const hut = document.createElement('div');
                hut.id = `hut-${idx}`;
                hut.className = `hut-card idle-float`;
                hut.style.left = `${pos.x}%`;
                hut.style.top = `${pos.y}%`;
                hut.style.animationDelay = `${idx * 0.25}s`;

                // SVG Straw Hut Graphic
                hut.innerHTML = `
                    <div class="relative flex flex-col items-center">
                        <!-- Hut Number Tag -->
                        <div class="bg-rose-500 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow-md mb-1 border-2 border-white">
                            #${idx + 1}
                        </div>
                        
                        <!-- Hut SVG Body -->
                        <div class="w-16 h-16 md:w-20 md:h-20 relative">
                            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- Straw Roof -->
                                <path d="M50 5 L95 45 L5 45 Z" fill="#d97706" stroke="#92400e" stroke-width="3"/>
                                <path d="M50 8 L85 43 H15 Z" fill="#f59e0b"/>
                                <path d="M50 5 L50 45 M30 25 L40 45 M70 25 L60 45" stroke="#b45309" stroke-width="2"/>
                                <!-- Wooden House Body -->
                                <rect x="18" y="45" width="64" height="48" fill="#fde68a" stroke="#b45309" stroke-width="3" rx="4"/>
                                <!-- Door -->
                                <rect x="38" y="60" width="24" height="33" rx="3" fill="#78350f"/>
                                <circle cx="58" cy="78" r="2" fill="#fbbf24"/>
                                <!-- Window -->
                                <rect x="25" y="55" width="10" height="10" fill="#93c5fd" stroke="#78350f" stroke-width="1.5"/>
                            </svg>
                            <!-- Visited Status Badge (Green Checkmark) -->
                            <div id="check-${idx}" class="absolute -top-1 -right-1 bg-emerald-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border-2 border-white shadow-lg hidden">
                                <i class="fas fa-check"></i>
                            </div>
                        </div>
                    </div>
                `;

                hut.addEventListener('click', () => openQuizModal(idx));
                villageMap.appendChild(hut);
            });
        }

        // Open Quiz Modal
        function openQuizModal(index) {
            playSound('click');
            if (hutStates[index]) {
                // If already visited, just notify
                return;
            }

            currentHutIndex = index;
            const qData = QUESTIONS[index];

            questionTag.innerText = `茅草屋 #${index + 1}`;
            questionText.innerText = qData.title;

            // Reset modal state
            feedbackBox.classList.add('hidden');
            modalNextBtn.classList.add('hidden');
            optionsContainer.innerHTML = '';

            // Render 4 Options
            qData.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-2xl border-2 border-gray-200 bg-gray-50 hover:bg-rose-50 hover:border-rose-300 font-bold text-gray-700 transition active:scale-98 flex items-center gap-3`;
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-full bg-rose-200 text-rose-800 flex items-center justify-center text-sm font-black shrink-0">
                        ${String.fromCharCode(65 + optIdx)}
                    </span>
                    <span>${optText}</span>
                `;
                btn.onclick = () => checkAnswer(optIdx, btn);
                optionsContainer.appendChild(btn);
            });

            // Show Modal with Animation
            quizModal.classList.remove('hidden');
            setTimeout(() => {
                quizModal.classList.remove('opacity-0');
                quizCard.classList.remove('scale-95');
                quizCard.classList.add('scale-100');
            }, 10);
        }

        // Check Answer Logic
        function checkAnswer(selectedIndex, selectedBtn) {
            const qData = QUESTIONS[currentHutIndex];
            const allOptionBtns = optionsContainer.querySelectorAll('button');

            // Disable all option buttons after picking
            allOptionBtns.forEach(btn => btn.disabled = true);

            if (selectedIndex === qData.answer) {
                // Correct
                playSound('correct');
                correctCount++;
                selectedBtn.className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-400 bg-emerald-50 text-emerald-800 font-bold flex items-center gap-3";
                feedbackBox.className = "p-4 rounded-2xl mb-4 text-sm font-bold border border-emerald-200 bg-emerald-50 text-emerald-800 leading-relaxed";
                feedbackBox.innerHTML = `<i class="fas fa-circle-check text-emerald-500 mr-1"></i> 答對了！${qData.explain}`;
            } else {
                // Incorrect
                playSound('wrong');
                selectedBtn.className = "w-full text-left p-4 rounded-2xl border-2 border-rose-400 bg-rose-50 text-rose-800 font-bold flex items-center gap-3";
                allOptionBtns[qData.answer].className = "w-full text-left p-4 rounded-2xl border-2 border-emerald-400 bg-emerald-50 text-emerald-800 font-bold flex items-center gap-3";
                feedbackBox.className = "p-4 rounded-2xl mb-4 text-sm font-bold border border-rose-200 bg-rose-50 text-rose-800 leading-relaxed";
                feedbackBox.innerHTML = `<i class="fas fa-circle-xmark text-rose-500 mr-1"></i> 答錯囉！正確答案是 ( ${String.fromCharCode(65 + qData.answer)} )。<br>${qData.explain}`;
            }

            // Update state
            hutStates[currentHutIndex] = true;
            answeredCount++;
            document.getElementById(`check-${currentHutIndex}`).classList.remove('hidden');

            scoreDisplay.innerText = `答對題數：${correctCount} / 10`;
            feedbackBox.classList.remove('hidden');
            modalNextBtn.classList.remove('hidden');
        }

        // Close Quiz Modal and Check Game Completion
        function closeQuizModal() {
            playSound('click');
            quizCard.classList.remove('scale-100');
            quizCard.classList.add('scale-95');
            quizModal.classList.add('opacity-0');

            setTimeout(() => {
                quizModal.classList.add('hidden');
                
                // Check if all 10 questions answered
                if (answeredCount >= 10) {
                    showSettlementModal();
                }
            }, 250);
        }

        // Show Final Settlement Modal (< 8 Challenge Again | >= 8 Next Level)
        function showSettlementModal() {
            const resIcon = document.getElementById('result-icon');
            const resTitle = document.getElementById('result-title');
            const resDesc = document.getElementById('result-desc');
            const resActions = document.getElementById('result-action-container');

            if (correctCount < 8) {
                // Failed (< 8 correct)
                playSound('wrong');
                resIcon.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl bg-amber-100 text-amber-500 shadow-inner animate-bounce";
                resIcon.innerText = "💪";
                resTitle.innerText = "再接再厲！";
                resDesc.innerHTML = `您一共答對了 <span class="text-2xl font-black text-rose-500">${correctCount}</span> / 10 題。<br>距離通關標準 ( 8 題 ) 還差一點點，再挑戰一次吸收更多平權知識吧！`;
                
                resActions.innerHTML = `
                    <button onclick="reloadGame()" class="w-full bg-gradient-to-r from-amber-500 to-rose-500 hover:from-amber-600 hover:to-rose-600 text-white font-black text-xl py-4 rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fas fa-rotate-right"></i> 重新挑戰
                    </button>
                `;
            } else {
                // Success (>= 8 correct)
                playSound('correct');
                resIcon.className = "w-24 h-24 rounded-full flex items-center justify-center mx-auto mb-4 text-5xl bg-emerald-100 text-emerald-500 shadow-inner animate-bounce";
                resIcon.innerText = "🎉";
                resTitle.innerText = "恭喜通關！";
                resDesc.innerHTML = `太厲害了！您一共答對了 <span class="text-2xl font-black text-emerald-600">${correctCount}</span> / 10 題！<br>成功掌握性別平權的核心價值，準備好挑戰下一關了嗎？`;

                resActions.innerHTML = `
                    <button onclick="goToLevel2()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-black text-xl py-4 rounded-2xl shadow-xl transform active:scale-95 transition flex items-center justify-center gap-2">
                        <span>前往下一關</span> <i class="fas fa-arrow-right"></i>
                    </button>
                `;
            }

            resultModal.classList.remove('hidden');
            setTimeout(() => {
                resultModal.classList.remove('opacity-0');
            }, 10);
        }

        // Action: Reload index.html
        function reloadGame() {
            window.location.reload();
        }

        // Action: Navigate to level2.html
        function goToLevel2() {
            window.location.href = 'level2.html';
        }
    </script>
</body>
</html>
